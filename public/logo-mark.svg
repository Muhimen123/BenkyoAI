<svg
  viewBox="80 20 320 320"
  width="320"
  height="320"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="BenkyoAI icon"
>
  <!-- Icon tile -->
  <rect x="80" y="20" width="320" height="320" rx="64" fill="#283B0A" />

  <!-- Subtle inner glow on tile -->
  <rect
    x="80"
    y="20"
    width="320"
    height="320"
    rx="64"
    fill="none"
    stroke="#A7A865"
    stroke-width="1.5"
    opacity="0.3"
  />

  <!-- Open book – left page (Harvest Gold) -->
  <path
    d="M 232 276
       L 118 276
       L 118 138
       Q 175 112 232 116
       Z"
    fill="#DD9C00"
  />

  <!-- Left page inner highlight strip near spine -->
  <path
    d="M 206 276
       L 188 276
       L 188 119
       Q 210 114 232 116
       L 232 276
       Z"
    fill="#FAE45E"
    opacity="0.30"
  />

  <!-- Left page ruled lines -->
  <line x1="131" y1="155" x2="223" y2="150" stroke="#563D23" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />
  <line x1="131" y1="172" x2="223" y2="168" stroke="#563D23" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />
  <line x1="131" y1="189" x2="223" y2="185" stroke="#563D23" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />
  <line x1="131" y1="206" x2="223" y2="203" stroke="#563D23" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />
  <line x1="131" y1="223" x2="223" y2="221" stroke="#563D23" stroke-width="2.5" stroke-linecap="round" opacity="0.30" />

  <!-- Open book – right page (Maize) -->
  <path
    d="M 248 276
       L 362 276
       L 362 138
       Q 305 112 248 116
       Z"
    fill="#FAE45E"
  />

  <!-- Right page inner shadow strip near spine -->
  <path
    d="M 274 276
       L 292 276
       L 292 119
       Q 270 114 248 116
       L 248 276
       Z"
    fill="#DD9C00"
    opacity="0.35"
  />

  <!-- Right page ruled lines -->
  <line x1="349" y1="155" x2="257" y2="150" stroke="#563D23" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />
  <line x1="349" y1="172" x2="257" y2="168" stroke="#563D23" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />
  <line x1="349" y1="189" x2="257" y2="185" stroke="#563D23" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />
  <line x1="349" y1="206" x2="257" y2="203" stroke="#563D23" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />
  <line x1="349" y1="223" x2="257" y2="221" stroke="#563D23" stroke-width="2.5" stroke-linecap="round" opacity="0.22" />

  <!-- Spine shadow -->
  <rect x="232" y="116" width="16" height="160" fill="#563D23" opacity="0.18" />

  <!-- Book bottom shadow ellipse -->
  <ellipse cx="240" cy="278" rx="72" ry="7" fill="#1A2B06" opacity="0.5" />

  <!-- AI spark at spine top -->
  <circle cx="240" cy="104" r="18" fill="#FAE45E" opacity="0.12" />
  <circle cx="240" cy="104" r="13" fill="#FAE45E" opacity="0.18" />

  <!-- 4-point star -->
  <path
    d="M 240 88
       L 243.5 100.5
       L 256 104
       L 243.5 107.5
       L 240 120
       L 236.5 107.5
       L 224 104
       L 236.5 100.5
       Z"
    fill="#FAE45E"
  />

  <!-- Tiny satellite dots — AI / neural feel -->
  <circle cx="265" cy="91" r="2.8" fill="#A7A865" opacity="0.9" />
  <circle cx="215" cy="91" r="2.8" fill="#A7A865" opacity="0.9" />
  <circle cx="270" cy="116" r="2" fill="#A7A865" opacity="0.65" />
  <circle cx="210" cy="116" r="2" fill="#A7A865" opacity="0.65" />
</svg>
